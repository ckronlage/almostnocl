services:
  ancl:
    platform: linux/amd64
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Persist uploads and outputs across restarts
      - ../../uploads:/workspace/uploads
      - ../../outputs:/workspace/outputs
      - ../../shared:/workspace/shared:ro
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all
